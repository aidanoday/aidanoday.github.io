name: Update market data

on:
  schedule:
    # 02:30 UTC Tue–Sat = a few hours after each US market close (Mon–Fri)
    - cron: '30 2 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest benchmark data
        run: node scripts/update_market_data.mjs
      - name: Commit and push if changed
        run: |
          if ! git diff --quiet assets/sp500_data.js assets/vigax_data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/sp500_data.js assets/vigax_data.js
            git commit -m "chore: update benchmark data ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Data already up to date."
          fi
